    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    /* This is a colour-coded instrument: opt out of the browser recolouring the
       page (auto dark mode, Windows/High-Contrast forced-colors) so the panel
       art and domain colours render exactly as designed. */
    html { color-scheme: light; forced-color-adjust: none; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, system-ui, sans-serif; font-size: 15px;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* floating signal scopes + their callouts */
    .scope { position: fixed; z-index: 1250; background: #0d0f0c; border: 1px solid #3ad16b; border-radius: 6px;
 padding: 0; cursor: default; }
    .scope-canvas { display: block; border-radius: 3px; }
    /* A small clickable nub at the bottom-centre of the display opens the values panel. */
    /* Values panel below the display: spin boxes for the two scales. */
    .scope-values { display: flex; opacity: 0; font-variant-numeric: tabular-nums; pointer-events: none; transition: opacity 1s; position: absolute; left: 50%; transform: translateX(-50%); background: #0a0c09; color: #ffffff; border: 1px solid #8a8d92; border-radius: 4px; padding: 2px 7px; font-size: 13px; font-weight: 400; line-height: 1; white-space: nowrap; align-items: center; gap: 4px; z-index: 2; user-select: none; -webkit-user-select: none; }
    .scope-values.show { opacity: 1; pointer-events: auto; }
    .scope-spin { display: inline-flex; align-items: center; gap: 3px; }
    .scope-arrows { display: inline-flex; flex-direction: column; line-height: 0.7; }
    .scope-arrows button { background: none; border: none; color: #ff9d3a; cursor: pointer; padding: 0; margin: 0; display: block; font-size: 0.72em; }
    .scope-arrows button:hover { color: #ffd089; }
    .scope-modestep { position: absolute; left: 50%; background: none; border: none; color: #8a8d92; cursor: var(--spin); padding: 1px 4px; margin: 0; font-size: 0.7em; line-height: 0.7; z-index: 3; }
    .scope-modestep.up { top: 0; transform: translate(-50%, -12%); }
    .scope-modestep:hover { color: #b8bbc0; }
    .scope-splabel { color: #ff9d3a; font-weight: 700; }
    .scope-val { display: inline-block; }
    .scope-half { display: inline-flex; align-items: center; gap: 3px; }
    .scope-half-l .scope-val { text-align: right; } .scope-half-r .scope-val { text-align: left; }
    .scope-vdiv { color: #6a6d70; }
    .scope-tip { position: fixed; display: none; z-index: 4001; background: #0a0c09; color: #ffffff; border: 1px solid #8a8d92; border-radius: 4px; padding: 2px 7px; font: 400 11px/1 sans-serif; white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none; }
    .scope-tip.show { display: block; }
    .scope-playpause { position: absolute; left: 1px; bottom: 1px; width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; cursor: default; }
    .scope:hover .scope-playpause { opacity: 0.85; }
    .scope-playpause:hover { opacity: 1; }
    .scope-playpause svg { width: 100%; height: 100%; display: block; }
    .scope-trigbtn { position: absolute; left: 33px; bottom: 1px; width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; cursor: default; display: flex; align-items: center; justify-content: center; color: #6a6d70; font: 700 11px/1 sans-serif;  user-select: none; -webkit-user-select: none; }
    .scope-trigbtn.on { color: #ff9d3a; }
    .scope:hover .scope-trigbtn { opacity: 0.85; }
    .scope-trigbtn:hover { opacity: 1; }
    .scope-followbtn { position: absolute; right: 1px; top: 1px; width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; cursor: default; display: flex; align-items: center; justify-content: center; color: #6a6d70; font: 700 11px/1 sans-serif; user-select: none; -webkit-user-select: none; }
    .scope-followbtn.on { color: #ff9d3a; }
    .scope:hover .scope-followbtn { opacity: 0.85; }
    .scope-followbtn:hover { opacity: 1; }
    .scope-autobtn { position: absolute; left: 17px; bottom: 1px; width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; cursor: default; display: flex; align-items: center; justify-content: center; color: #ff9d3a; font: 700 11px/1 sans-serif;  user-select: none; -webkit-user-select: none; }
    .scope:hover .scope-autobtn { opacity: 0.85; }
    .scope-autobtn:hover { opacity: 1; }
    .scope-autobtn.pressed { color: #ffd089; transform: scale(0.8); }
    .scope-gridbtn { position: absolute; left: 49px; bottom: 1px; width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; cursor: default; display: flex; align-items: center; justify-content: center; color: #ff9d3a; font: 700 11px/1 sans-serif; user-select: none; -webkit-user-select: none; }
    .scope:hover .scope-gridbtn { opacity: 0.85; }
    .scope-gridbtn:hover { opacity: 1; }
    .scope-gridbtn.pressed { color: #ffd089; transform: scale(0.8); }
    .scope-freq { align-items: center; gap: 4px; }
    .scope-peak { align-items: center; gap: 4px; }
    .scope-pcell { display: inline-flex; align-items: baseline; gap: 3px; }
    .scope-closebtn { position: absolute; right: 1px; top: 1px; width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #8a8d92; font: 700 15px/1 sans-serif; user-select: none; -webkit-user-select: none; }
    .scope:hover .scope-closebtn { opacity: 0.85; }
    .scope-closebtn:hover { opacity: 1; color: #d8dade; }
    .scope-homebtn { position: absolute; right: 17px; top: 1px; width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #c2c6cc; font: 700 13px/1 sans-serif; user-select: none; -webkit-user-select: none; }
    .scope:hover .scope-homebtn { opacity: 0.85; }
    .scope-homebtn:hover { opacity: 1; color: #d8dade; }
    .scope-homebtn svg { width: 11px; height: 11px; display: block; fill: currentColor; }
    .scope-close, .scope-min { position: absolute; top: 3px; width: 10px; height: 10px; border-radius: 50%; opacity: 0; transition: opacity 0.1s; cursor: pointer; display: flex; align-items: center; justify-content: center; font: 700 9px/1 sans-serif; user-select: none; -webkit-user-select: none; }
    .scope:hover .scope-close, .scope:hover .scope-min { opacity: 0.9; }
    .scope-close:hover, .scope-min:hover { opacity: 1; }
    .scope-close { left: 2px; background: #ff5f57; color: rgba(70,8,8,0.55); }
    .scope-min { left: 13px; background: #febc2e; color: rgba(90,60,0,0.6); }
    .scope-min::after { content: '\2013'; }                       /* minimize: a dash */
    .scope.minimized .scope-min::after { content: '+'; }         /* restore: a plus, same yellow button */
    .scope-token { display: none; width: 24px; height: 24px; align-items: center; justify-content: center; color: #ffffff; cursor: var(--grip); }
    .scope-token svg { width: 20px; height: 13px; display: block; }
    .scope.minimized .scope-canvas { display: none; }
    .scope.minimized .scope-token { display: flex; }
    .scope.minimized:hover .scope-token { color: #d8dade; }
    .scope.minimized .scope-followbtn, .scope.minimized .scope-homebtn, .scope.minimized .scope-values, .scope.minimized .scope-playpause, .scope.minimized .scope-trigbtn, .scope.minimized .scope-autobtn, .scope.minimized .scope-gridbtn, .scope.minimized .scope-triglevel, .scope.minimized .scope-modestep { display: none; }
    .scope-homebtn.athome { color: #74777c; cursor: default; }
    .scope:hover .scope-homebtn.athome { opacity: 0.35; }
    .scope-homebtn.athome:hover { opacity: 0.35; color: #74777c; }
    .scope-triglevel { position: absolute; left: 0; width: 100%; height: 1.5px; margin-top: -0.75px; background: rgba(255,157,58,0.9); pointer-events: none; z-index: 2; }
    .scope-preview { pointer-events: none; opacity: 0.8; border-style: dashed; cursor: default; }
    .scope-dot { position: fixed; z-index: 1246; width: 10.5px; height: 10.5px; background: #8a8d92; transform: translate(-50%,-50%); cursor: var(--grip); }
    .scope-callouts { position: fixed; inset: 0; pointer-events: none; z-index: 1240; overflow: visible; }
    /* While navigating the view (Option held, or the overview up) the loops that redraw these are suspended,
       so the leader lines and handles would lag behind their scopes/monitors. Hide them for the gesture. */
    body.view-navigating .scope-callouts, body.view-navigating .scope-dot { display: none; }
    .mon { position: fixed; z-index: 1250; width: 34px; height: 34px; border-radius: 50%; background: #0d0f0c; border: 1px solid #8a8d92;
 cursor: default; display: flex; align-items: center; justify-content: center; color: #cfe8d4; }
    .mon svg:not(.mon-arc) { width: 15px; height: 15px; display: block; }
    .mon-tick { position: absolute; left: 50%; top: 2.5px; width: 2px; height: 6px; margin-left: -1px; background: #dfeee3; border-radius: 1px; transform-origin: 50% 14.5px; pointer-events: none; }
    .mon-arc { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    /* Monitor close: upper-LEFT, same red Mac-dot look as a scope close (no minimize on monitors). */
    .mon-close { position: absolute; top: -3px; left: -3px; width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; color: rgba(70,8,8,0.55); font: 700 9px/1 sans-serif; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.1s; cursor: pointer; z-index: 1; }
    .mon:hover .mon-close { opacity: 0.9; }
    .mon-close:hover { opacity: 1; }
    .mon-live { border-color: #3ad16b; box-shadow: inset 0 0 0 2px #3ad16b; }   /* green: this monitor is feeding the enabled monitor bus */
    .mon-muted { border-color: #e22a2a; box-shadow: inset 0 0 0 2px #e22a2a; }   /* muted: red ring, thickened inward */
    .mon-muted::after { content: ''; position: absolute; left: 3px; right: 3px; top: calc(50% - 1.5px); height: 3px; background: #e22a2a; border-radius: 1px; transform: rotate(-45deg); pointer-events: none; }   /* red diagonal, upper-right to lower-left, as thick as the ring */

    /* The head is a FIXED indicator over a scrolling document, not part of it — so it needs a

       rules below it. The rule is drawn in --t-edge, the BRIGHTEST value either theme defines
       (near-white on the dark card, near-black on the light one), so it cannot be mistaken for
       the dim greys used inside the text: the section rules are 32% grey and the body separators
       dimmer still. A lifted background and a soft shadow put the head on its own plane. */
    .tour-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 11px;
      border-bottom: 2.5px solid var(--t-edge); background: rgba(128,128,128,0.10);
 cursor: move; touch-action: none;
      position: relative; z-index: 1; }
    .tour-title { flex: 1 1 auto; font-weight: 600; }
    .tour-x { flex: none; width: 1.3em; height: 1.3em; padding: 0; background: none; border: none;
      color: var(--t-dim); font: 400 0.8em/1 -apple-system, system-ui, sans-serif; cursor: pointer; border-radius: 4px; }
    /* Looks like a button, because it is one: same shape as Close in the footer, so the two
       read as the same kind of thing. It was previously borderless and read as a text link. */
    .tour-home { flex: none; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--t-edge);
      background: rgba(128,128,128,0.14); color: var(--t-ink); font-size: 0.82em; line-height: 1.3;
      font: 400 0.72em/1 -apple-system, system-ui, sans-serif; cursor: pointer; border-radius: 4px; }
    .tour-x:hover { color: var(--t-ink); background: rgba(128,128,128,0.18); }
    .tour-home:hover { background: rgba(128,128,128,0.30); border-color: var(--t-ink); }
    /* min-height:0 lets a flex child actually shrink and scroll. The bar is styled dark on a
       transparent track — the default macOS bar is a dazzling white slab over our panels.
       Deliberately NO scrollbar-width/scrollbar-color: setting either makes Chromium ignore the
       ::-webkit-scrollbar rules below and fall back to a macOS OVERLAY bar, which fades out when
       idle — and an invisible bar means a reader can't tell the step continues below the fold. */
    /* SCROLL COST. The handler is cheap; the paint was not. The card sits over the rack — a large,
       SVG-heavy DOM — and without containment the browser had to consider all of that on every
       scroll of a five-thousand-pixel document carrying nine hundred elements. `contain: paint` says
       nothing inside can draw outside, so the scroller becomes its own raster; promoting the card
       keeps the rack behind it off the repaint entirely; and containing each section stops one
       section's layout from being re-examined when another moves. */
    .tour-body { contain: paint; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding: 10px 11px; user-select: text; -webkit-user-select: text; }
    .tour-body::-webkit-scrollbar { width: 9px; }

      border: 2px solid transparent; background-clip: content-box; }
    .tour-body::-webkit-scrollbar-thumb:hover { background: rgba(180,180,180,0.7); background-clip: content-box; }
    .tour-body a { color: var(--t-accent); }

    .tour-body .tour-key { color: var(--t-accent); }
    /* The video output's IN-APP pane — the fallback where Document Picture-in-Picture is missing
       (Firefox, Safari). Chromium gets a real OS window instead and never draws this. */
    .video-window { position: fixed; right: 24px; bottom: 24px; z-index: 1400;
      display: flex; flex-direction: column; background: #000; resize: both; overflow: hidden;
      border: 1px solid #444; border-radius: 6px; }
    .video-window-bar { flex: none; display: flex; align-items: center; justify-content: space-between;

      font: 600 11px/1.4 -apple-system, system-ui, sans-serif; user-select: none; }
    .video-window-close { border: none; background: none; color: #c8c8cc; cursor: pointer;
      font: 400 15px/1 -apple-system, system-ui, sans-serif; padding: 0 4px; }

       magnified. Click-through — it must never be a target, only something to look at. */
    /* A video monitor: a live picture of ONE point in the graph, clipped anywhere, as many as
       wanted. The audio side's ear monitors and scopes, for the other sense.

       The BORDER carries the state, the way the scope's does: green while it is live, red while
       it is frozen. No title bar — at 160px wide a bar spends a tenth of the picture saying what
       the object already says. */

      cursor: var(--move); }

    .video-monitor-canvas { display: block; width: 80px; height: 45px; border-radius: 5px; }
    /* The scope's own close dot, in the same corner and with the same hover behaviour. */
    .video-monitor-close { position: absolute; left: 2px; top: 2px; width: 10px; height: 10px;

       millimetres, so it scales with rack zoom like everything else on the face. */
    .module-readout-text { width: 100%; height: 100%; margin: 0; padding: 0.6px 0.8px;
      font: 600 3.1px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; color: #dfe4ea;
      overflow: hidden; word-break: break-word; user-select: none; -webkit-user-select: none; }
    .module-readout-text.bad { color: #ff8a80; }
    /* Its editor: a floating panel, deliberately at normal reading size rather than panel size. */
    .readout-editor { position: fixed; z-index: 1450; width: 340px; display: flex;
      flex-direction: column; gap: 6px; padding: 8px; border-radius: 8px;
      background: #cfcfcf; color: #163a69; border: 1.5px solid #141414;
 font: 400 13px/1.4 -apple-system, system-ui, sans-serif; }
    .readout-editor.theme-dark { background: #262629; color: #b8b8bc; border-color: #d2d2d6; }
    .readout-editor-title { font-weight: 600; cursor: grab; user-select: none; }

    .readout-editor-msg.bad { color: #e2422a; opacity: 1; }

    .video-follow { position: fixed; z-index: 1500; width: 96px; height: 54px;
      pointer-events: none; background: #000; border: 1px solid #555; border-radius: 4px;
 }
    /* One continuous document: each `##` in tutorial.md is a section with its own heading and a
       seam above it. The head reports which section you are scrolled into, so the heading here is
       for scanning while you scroll rather than for telling you where you are. */
    .tour-section { scroll-margin-top: 4px; }
    .tour-h { margin: 0 0 6px; font-size: 0.875em; font-weight: 600; color: var(--t-ink); }
    /* As bright as the seam under the title bar — same --t-edge — so a section boundary is
       unmistakable. Thinner than the head's 2.5px, so the head still reads as the heavier line
       and the hierarchy survives: window chrome, then section, then text. */
    .tour-section { contain: layout style; }

      margin: 18px 0 14px; }

       magnification the eye returns to the left edge, so that is where a control has to be to be
       found, and a column keeps the prose's left edge straight. It holds what you can do with this
       paragraph — listen on top, and where there is one, a play triangle below it. */

    /* ORANGE OUTLINE, BLACK FILL, near-white glyph. The black is what makes one small control legible
       on either face — the tutorial has a light one and a dark one — and it is the same chip the demo's
       gesture badge wears, so everything this subsystem puts on screen reads as one family. Filling
       the button with orange made it shout louder than the paragraph it belongs to.
       The LEGEND draws the whole button rather than a bare glyph: the line then shows you the thing
       you are about to look for, which is the entire point of a legend. */
    .tour-listen, .tour-demo, .tour-icon { border-radius: 5px; line-height: 0;
      background: #000; border: 1px solid var(--t-accent); color: rgba(255,255,255,0.8); }
    .tour-listen, .tour-demo { width: 22px; height: 22px; padding: 3px; cursor: pointer; }

    .tour-p + .tour-try, .tour-try + .tour-p, .tour-p + .tour-p, .tour-try + .tour-try { margin-top: 10px; }
    .tour-try { padding: 7px 9px; border-left: 2px solid var(--t-accent);

    .tour-try-label { color: var(--t-accent); }
    .tour-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 16px 8px 11px; border-top: 1px solid var(--t-sep); flex-wrap: wrap; }   /* right pad: clear of the resize grip */
    .tour-left, .tour-nav { display: flex; align-items: center; gap: 6px; }
    .tour-count { color: var(--t-dim); font-size: 0.72em; margin-right: 2px; }

    .tour-never { display: inline-flex; align-items: center; gap: 4px; color: var(--t-dim);

    /* Fully custom box: the native checkbox renders a light square in both modes, which on the dark

    body.grabbing-cable, body.grabbing-cable * { cursor: var(--grip) !important; }

    /* The two armed modes say what a click will do by changing the pointer: the same hand carrying a
       plus, or carrying a red ×. Nothing else on screen changes, so the cursor is the whole signal —
       which is why the delete one is red and the duplicate one is not. */
    /* ...and in delete mode a title bar lights red as you pass over it, so you can see what you are
       about to remove before you commit to it. */


    /* ---- rack (single scrolling viewport with a scaled content area) ---- */
    #rack { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; background: var(--bg); }
    /* Subtle, dark scrollbars so the horizontal bar (when a module runs past the right edge) never dazzles. */

       was. Shadows do not affect layout, so the edge looks the same and the two agree again. */
    .rack-row {

       cost; those are gone too. Line art reads more crisply without them. */
    .rack-module {
      position: absolute; top: 0; cursor: default;
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .rack-module.dragging { opacity: 0.85; z-index: 20; }
    .rack-module svg { display: block; width: 100%; height: 100%; }
    /* Overview navigator: press Option to see the whole rack fit to the window and aim the viewport. */
    .rack-overview-backdrop { position: fixed; inset: 0; z-index: 4000; background: var(--bg); pointer-events: none; }   /* opaque — the frozen fit-to-window picture fully replaces the live view (fills any letterbox margin) */
    .rack-overview { position: fixed; z-index: 4001; background: #14110d; }
    .rack-overview canvas { display: block; }
    .rack-overview-vp { position: absolute; left: 0; top: 0; will-change: transform; border: 2px solid var(--accent); background: rgba(224,163,83,0.10); box-sizing: border-box; pointer-events: none; }   /* positioned by transform so a move is a GPU composite, not a repaint over the dimmed backdrop */
    .rack-overview-cable { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }   /* a cable in hand, redrawn over the frozen picture so the pull stays visible while you navigate */
    .rack-ghost {
      position: absolute; top: 0; pointer-events: none; z-index: 25;   /* above the dragged module (z 20) so the drop outline shows even when dragging right, over the original */
      border: 2px dashed var(--accent); border-radius: 4px; background: rgba(224,163,83,0.12);
    }
    /* CARRYING THE MODULE ITSELF rather than an outline of it. The dashes go — the drawing is far
       easier to find over a rack full of panels than a hairline was — but the accent stays as a solid
       edge, since that edge is what shows the slot the module is about to take. Slightly transparent
       and lifted on a shadow, so it reads as held above the rack rather than already part of it. */
    /* Pinned to the WINDOW, not to a row: a carried module follows the pointer wherever it goes —
       past the end of a row, between rows, over the tab bar — and nothing snaps until it is dropped. */
    /* WHITE, NOT ACCENT, for both of these. The accent is the cables' colour, and a rack with a dozen
       cords across it gave the held module and its landing place nothing to stand out against. White
       belongs to neither the panels nor the patching, so it reads as something the app is telling you
       rather than something in the rack. Dashed for the module — a boundary that is not there yet. */
    .rack-ghost.carrying {
      position: fixed; z-index: 1500; border: 2px dashed #fff; background: none;
      opacity: 0.92; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.55);
    }
    /* ...and solid for where it will land, since that IS a place. */
    .rack-insert-mark { position: fixed; z-index: 1499; width: 4px; border-radius: 2px;
      background: #fff; box-shadow: 0 0 7px rgba(255,255,255,0.9), 0 0 2px rgba(0,0,0,0.6); pointer-events: none; }

    /* ---- context menu ---- */
    .rack-menu {
      position: fixed; z-index: 1400; min-width: 92px; max-height: 72vh; overflow-y: auto; font-size: 12px; line-height: 1.25;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 3px;
    }
    .rack-menu-header { padding: 5px 10px 2px; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-dim); }
    .rack-menu-header.clickable { cursor: pointer; user-select: none; }
    .rack-menu-header.clickable:hover { color: var(--ink); }
    .rack-menu-caret { display: inline-block; width: 1em; margin-right: 1px; color: var(--ink-dim); }
    .rack-menu-item { padding: 2px 10px; border-radius: 4px; cursor: pointer; color: var(--ink); }
    .rack-menu-item:hover { background: var(--accent); color: var(--accent-ink); }
    .rack-menu-item.current { background: var(--accent); color: var(--accent-ink); }
    .rack-menu-item:hover .rack-menu-check, .rack-menu-item.current .rack-menu-check { color: var(--accent-ink); }
    .rack-menu-item.dim { color: var(--ink-dim); }
    .rack-menu-item.dim:hover { color: var(--accent-ink); }
    .rack-menu-check { margin-left: auto; padding-left: 10px; color: var(--accent); }
    .rack-menu-eye { width: 14px; height: 14px; line-height: 0; color: inherit; opacity: 0.75; cursor: pointer; flex: none; margin-right: 6px; }
    .rack-menu-eye.off { opacity: 0.3; }
    .rack-menu-eye:hover { opacity: 1; }
    .rack-menu-eye svg { width: 14px; height: 14px; display: block; fill: currentColor; }
    .rack-menu-trash { width: 14px; height: 14px; line-height: 0; color: #d9534f; cursor: pointer; flex: none; margin-left: 5px; }
    .rack-menu-trash svg { width: 14px; height: 14px; display: block; fill: currentColor; }
    .rack-menu-trash:hover { color: #ff6b66; }
    .rack-menu-item { display: flex; align-items: center; }
    .rack-menu-sep { height: 1px; margin: 4px 6px; background: var(--line); pointer-events: none; }
    .rack-menu-icon { flex: none; width: 15px; height: 15px; margin-right: 7px; line-height: 0; color: inherit; }
    .rack-menu-icon svg { width: 15px; height: 15px; display: block; fill: currentColor; }
    /* Sound row: MSTR / MON, each followed by a round enable button (like the mixer enable lamp)
       — dark when off, red when on. Clicking a button toggles its bus; hovering an off button
       auditions it. The row itself never highlights or dismisses. */
    .rack-menu-item.rack-menu-words:hover { background: transparent; color: inherit; }
    .rack-menu-word { font-weight: 700; color: var(--ink-dim); margin-right: 6px; }
    .rack-menu-led { width: 12px; height: 12px; border-radius: 50%; background: #404044; border: 1px solid #a2a2a8; cursor: pointer; margin-right: 18px; }
    .rack-menu-led:last-child { margin-right: 0; }
    .rack-menu-led.on { background: radial-gradient(circle at 50% 42%, #ff7a5a, #d21010 55%, #8f0c0c); box-shadow: 0 0 3px rgba(221,20,20,0.55); }
    .rack-menu-arrow { margin-left: auto; padding-left: 16px; color: var(--ink-dim); }
    .rack-menu-item:hover .rack-menu-arrow { color: var(--accent-ink); }
    .rack-menu-item.disabled { color: var(--ink-dim); opacity: 0.55; cursor: default; }
    .rack-menu-item.disabled:hover { background: none; color: var(--ink-dim); }
    .rack-submenu { z-index: 1410; }
    .rack-menu { border-width: 1.5px; border-color: #141414; }            /* light mode: dark line to stand out */
    .rack-menu.theme-dark { border-color: #d2d2d6; }                       /* dark mode: light line */
    /* The bar wears the SAME outline as the menus that drop from it, so the two read as one
       object rather than a strip with unrelated panels hanging off it. */
    .rack-menubar { border-width: 1.5px; border-color: #141414; }
    .rack-menubar.theme-dark { border-color: #d2d2d6; }
    .confirm-overlay { position: fixed; inset: 0; z-index: 3200; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
    .confirm-box { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
      min-width: 240px; max-width: 360px; font: 13px/1.45 -apple-system, system-ui, sans-serif; }
    .confirm-msg { margin-bottom: 16px; }
    .confirm-btns { display: flex; justify-content: flex-end; gap: 8px; }
    .confirm-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
    .confirm-btn:hover { border-color: var(--ink-dim); }
    .confirm-danger { background: #8a3030; border-color: #8a3030; color: #fff; }
    .confirm-danger:hover { background: #a23a3a; border-color: #a23a3a; }

    /* ---- patch cables (SVG overlay; pointer-transparent) ---- */
    /* ---- the tab bar: one page of the rack at a time ----
       Outlined in the SAME bright rule that closes the menu bar, so the eye reads one continuous
       line: it runs along under the bar, climbs up and around the current tab, and carries on. */
    .rack-tabbar { --tab-edge: #141414;
      display: flex; align-items: flex-end; gap: 1px;
      font: 500 13px/1 -apple-system, system-ui, sans-serif; user-select: none; }
    .rack-tabbar.theme-dark { --tab-edge: #d2d2d6; }
    /* The negative bottom margin lets the strip hang past the bar's padding and its rule, which is
       what allows the current tab to cover that rule and the others to stand on top of it. */
    .rack-tabbar.in-bar { margin-left: 1.1em; margin-bottom: -3.5px; }
    .rack-tabbar:not(.in-bar) { margin-bottom: -3.5px; padding: 0 6px; background: var(--panel);
      border-bottom: 1.5px solid var(--tab-edge); }
    /* An UNSELECTED tab: outlined on three sides, open at the bottom, and stopping short so the
       bright rule passes UNDERNEATH it. That gap is the whole difference — it says this page is
       shut, sitting on the line rather than joined to what is below it. */
    .rack-tab { position: relative; min-width: 4.8em; margin: 3px 0 1.5px; padding: 4px 9px 1px 9px;
      display: flex; align-items: baseline; justify-content: center;
      border: 1.5px solid var(--tab-edge); border-bottom: none; border-radius: 7px 7px 0 0;
      background: transparent; color: var(--ink); font: inherit; cursor: pointer;
      white-space: nowrap; overflow: hidden; }
    .rack-tab:hover { background: rgba(128,128,128,0.18); color: var(--ink); }
    /* The name is set LARGE and sits low in the tab: a page label is the thing you aim at and read
       at a glance, and small type floating in the middle of a tab reads as a caption instead. */
    .rack-tab-name { line-height: 1; font-size: 21px; }
    /* NOTHING IS GREYED. Every tab is drawn at full strength, name and outline alike — a page with
       nothing on it yet is a real place you can go to, and dimming it said "disabled" instead of
       "empty". Which page you are on is carried entirely by the current tab joining the window
       below it; that is enough, and it needs no second signal shouted over the top of it. */
    /* The CURRENT tab stands taller and reaches down far enough to paint over the rule, and it is
       filled with THE RACK'S OWN BACKGROUND — the same colour as the page below it. So the tab and
       its page are one shape and the bright line appears to detour up and around the tab.
       NOT A LIGHTER GROUND, and not white lettering. A filled tab reads as a button, and a page you
       are already looking at does not need to be shouted; the open bottom joining it to the window
       is the whole signal, which is what a folder tab has always done. The name is set in the same
       ink as every other tab for the same reason. */
    /* A HALF AGAIN THICKER, GROWING INWARD. 1.5px becomes 2.25px and the padding gives back the same
       0.75 on each bordered side, so the tab's outer silhouette does not move: it still meets the rule
       where it did and still lines up with its neighbours. The weight reads as emphasis without any
       fill, so the interior goes on belonging to the page below. */
    .rack-tab.current { margin: 0; padding: 6.25px 8.25px 2.5px 8.25px; background: var(--bg);
      color: var(--ink); border-width: 2.25px; border-color: var(--tab-edge); opacity: 1; }
    /* ...and it does not take the hover fill either, which would put back the ground just removed. */
    .rack-tab.current:hover { background: var(--bg); }
    /* The + that adds a page, dressed as a tab so it belongs to the strip, but narrow: it is an
       action rather than a place, and it should not read as one more page you can be on. */
    .rack-tab-add { min-width: 0; padding-left: 12px; padding-right: 12px; }
    .rack-tab-add .rack-tab-name, .rack-tab-add { font-size: 19px; line-height: 1; }
    /* CLOSE, in the tab's top right corner. Positioned absolutely so it takes no part in the flex
       row: the name stays centred and no tab has to grow to hold it, since that corner is empty
       space in every tab already. The current tab stands taller and pads differently, so its × is
       nudged down to sit in the same place relative to the tab's own top edge.
       It borrows .tour-x for its shape, but not its colour — those variables belong to the tour
       card. Inheriting the tab's ink keeps it right on the grey current tab and the plain ones. */
    /* The room the × needs is real width on the tab, not an overlay on the name: _sizeTabs adds it
       to a closable tab's minimum and discounts it when measuring the width the tabs share, so only
       these tabs grow. The padding keeps the centred name out of the corner the × sits in. */
    .rack-tab.closable { padding-right: 20px; }
    .rack-tab-x { position: absolute; top: 1px; right: 3px; width: 1.15em; height: 1.15em;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: inherit; opacity: 0.55; }
    .rack-tab-x:hover { opacity: 1; background: rgba(128,128,128,0.30); }
    .rack-tab.current .rack-tab-x { top: 4px; }
    /* THE ENGINE LAMP on the Output tab: the Sound menu's lamp, sized to match the cable buttons
       already on this tab — 11px, which is MIXER_BTN_PX, 3mm across. It sits in the corner an audio
       tab gives its ×; this tab has no ×, so nothing collides. margin-right: 0 overrides the spacing
       the menu version carries for sitting in a row of its fellows. */
    .rack-tab-engine { position: absolute; top: 50%; transform: translateY(calc(-50% + 1px)); right: 4px;
      width: 11px; height: 11px; margin-right: 0; }
    /* Renaming happens IN the tab: the field wears the tab's own type and colours so the tab does
       not change size or appearance while you type into it. */
    .rack-tab-edit { font: inherit; font-size: 21px; line-height: 1; width: 5.2em;
      background: transparent; color: var(--ink); border: none; outline: none; padding: 0; margin: 0; }

    /* A cable crossing to another page spans two coordinate systems — the scrolling, zooming rack at
       one end and the fixed tab bar at the other — so it is painted in its own layer pinned to the
       window rather than inside the rack's cable overlay. Above the panels so it reads as passing
       over them, below the menus, and never in the way of a click. */
    .page-stubs { position: fixed; inset: 0; z-index: 1290; pointer-events: none; overflow: visible; }
    /* A cable IN HAND, drawn over the whole window so carrying one up to a tab does not run it into
       the rack's clipped edge and make it look dropped. Above the menu bar it has to reach, below
       the menus themselves. */
    .hand-cable { position: fixed; inset: 0; z-index: 1320; pointer-events: none; overflow: visible; }
    /* The one label shown at a time, flown off the stub under the pointer. Above the tab bar, because
       it has to stay readable while the pointer is still on the stub near the bar — and click-through,
       so it can never swallow a press on the tab it happens to be lying over. */
    .stub-flag { position: fixed; z-index: 1340; display: none; pointer-events: none;
      /* `color` is the CABLE's colour: the frame and the stem both take it from here, so the two can
         never drift apart. The lettering sets its own white. */
      background: #000; border: 1px solid currentColor;
      /* An EXPLICIT line-height, which is what lets the lettering grow without the chip growing. Left
         to itself a line box carries the font's own leading — three pixels of nothing above the capital
         letters — so the box was tall while the text was small. Pinning the line box to the height the
         caps actually need spends that space on the glyphs instead. */
      font: 600 14px/11px system-ui, -apple-system, sans-serif;
      padding: 1px 7px 2px; border-radius: 3px; white-space: nowrap;
 }
    .stub-flag-name { color: #fff; }
    /* A channel stub's chip stands UPRIGHT: the channel number on top, the meter down the left and
       the fader down the right — each the way its counterpart stands on the mixer. Fifteen screen
       millimetres of travel, which is enough to read a level and to watch one move. */
    .stub-flag.has-fader { padding: 1px 5px 4px; text-align: center; }
    .stub-flag-bars { display: flex; gap: 4px; justify-content: center; align-items: flex-end;
      height: 57px; margin-top: 3px; }
    .stub-flag-meter { position: relative; width: 4px; height: 100%; border-radius: 2px;
      background: rgba(255,255,255,.16); overflow: hidden; }
    .stub-flag-meter-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; }
    .stub-flag-track { position: relative; width: 4px; height: 100%; border-radius: 2px;
      background: rgba(255,255,255,.22); overflow: hidden; }
    .stub-flag-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #fff; }
    .rack-cables { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 12; overflow: visible; }
    /* The stand-in picture used while Option is held: same origin as the content it replaces. */
    .rack-frozen { position: absolute; top: 0; left: 0; display: none; pointer-events: none; z-index: 14; }
    .rack-cable { fill: none; stroke-linecap: round; opacity: 0.95; }
    .rack-cable-temp { opacity: 0.95; }   /* the cord in hand looks like a real thick cable — no dash, no fade */
  </style>
</head>
<body>
  <svg id="tutorialCallout"></svg>
  <div id="rack"></div>

  <script type="module" src="debug/rack-app.js"></script>
</body>
</html>
